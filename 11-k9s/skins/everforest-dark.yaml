# -----------------------------------------------------------------------------
# Everforest Dark (Medium Contrast)
# https://github.com/sainnhe/everforest/blob/master/palette.md#dark
# -----------------------------------------------------------------------------

text:    &text    "#d3c6aa"
base:    &base    "#2D353B"  # bg0 (medium)
overlay: &overlay "#343F44"  # bg1
muted:   &muted   "#56635F"  # gray
red:     &red     "#e67e80"
blue:    &blue    "#7fbbb3"
yellow:  &yellow  "#dbbc7f"
green:   &green   "#a7c080"
pink:    &pink    "#d699b6"
orange:  &orange  "#e69875"

# Skin...
k9s:
  # General K9s styles
  body:
    fgColor: *text
    bgColor:  default
    logoColor: *green
  # Command prompt styles
  prompt:
    fgColor: *text
    bgColor:  default
    suggestColor: *green
    border:
      command: *orange
      default: *blue
  # ClusterInfoView styles.
  info:
    fgColor: *green
    sectionColor: *text
  # Dialog styles.
  dialog:
    fgColor: *text
    bgColor:  default
    buttonFgColor: *text
    buttonBgColor: *green
    buttonFocusFgColor: *yellow
    buttonFocusBgColor: *green
    labelFgColor: *yellow
    fieldFgColor: *text
  frame:
    # Borders styles.
    border:
      fgColor: *overlay
      focusColor: *overlay
    menu:
      fgColor: *text
      keyColor: *green
      # Used for favorite namespaces
      numKeyColor: *green
    # CrumbView attributes for history navigation.
    crumbs:
      fgColor: *text
      bgColor: *overlay
      activeColor: *overlay
    # Resource status and update styles
    status:
      newColor: *green
      modifyColor: *red
      addColor: *blue
      errorColor: *pink
      highlightcolor: *yellow
      killColor: *muted
      completedColor: *muted
    # Border title styles.
    title:
      fgColor: *text
      bgColor: *overlay
      highlightColor: *yellow
      counterColor: *green
      filterColor: *green
  views:
    # Charts skins...
    charts:
      bgColor: default
      defaultDialColors:
        - *green
        - *pink
      defaultChartColors:
        - *green
        - *pink
    # TableView attributes.
    table:
      fgColor: *text
      bgColor:  default
      # Header row styles.
      header:
        fgColor: *text
        bgColor:  default
        sorterColor: *red
    # Xray view attributes.
    xray:
      fgColor: *text
      bgColor:  default
      cursorColor: *overlay
      graphicColor: *green
      showIcons: false
    # YAML info styles.
    yaml:
      keyColor: *green
      colonColor: *green
      valueColor: *text
    # Logs styles.
    logs:
      fgColor: *text
      bgColor:  default
      indicator:
        fgColor: *text
        bgColor:  default

